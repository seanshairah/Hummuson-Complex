name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: humuson
          POSTGRES_PASSWORD: humuson
          POSTGRES_DB: humuson
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U humuson"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://humuson:humuson@localhost:5432/humuson
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_SITE_URL: http://localhost:3111
      NEXT_PUBLIC_WHATSAPP_NUMBER: "263776656433"
      ADMIN_EMAIL: admin@humusoncomplex.com
      ADMIN_PASSWORD: humuson-dev-admin
      ADMIN_NAME: CI Admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed content
        run: npm run db:seed

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: ""

      - name: End-to-end tests
        run: npx playwright test
        env:
          CI: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
