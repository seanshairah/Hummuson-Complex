version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Patch and minor bumps arrive grouped, so routine maintenance is one
    # review rather than a dozen. Majors come as their own pull request
    # because each needs reading, not merging.
    groups:
      patch-and-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
    labels: ["dependencies"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies"]
